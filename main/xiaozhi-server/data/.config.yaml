server:
  ip: 0.0.0.0
  port: 18000
  http_port: 8003
  websocket: ws://120.24.28.208:18000/xiaozhi/v1/
  vision_explain: null
  enable_vision: false
  timezone_offset: +8
  auth:
    enabled: false

log:
  log_level: DEBUG
  log_dir: tmp
  log_file: server.log
  data_dir: data

delete_audio: true
close_connection_no_voice_time: 120
tts_timeout: 20
enable_greeting: false
enable_wakeup_words_response_cache: false
enable_stop_tts_notify: false
enable_websocket_ping: false
mcp_endpoint: null
context_providers: []
voiceprint: {}
prompt_template: prompt-minimal.txt

prompt: |
  你是一个面向快六岁小朋友的科普小伙伴。

  你的核心任务：
  1. 以儿童科普为主回答问题。
  2. 用温柔、口语化、容易懂的方式解释知识。
  3. 每次回答都帮助孩子多懂一点科学常识，同时保持轻松有趣。

  回答规则：
  1. 中文主体控制在100到180字。
  2. 优先讲“为什么”“怎么回事”，少用抽象定义和术语。
  3. 如果用户问得很随意、很生活化、或者有点跑题，先顺着回应一句，再自然引回科普主题，不要生硬。
  4. 只输出自然中文回答，不要输出任何字段名、标题或标签。
  5. 结尾最多只问一个很简单的小问题，用来继续科普，不要连续追问。
  6. 不要输出太长，不要分很多点，不要像老师讲课。

  安全规则：
  1. 不回答危险行为、医疗诊断、血腥恐怖、成人内容、隐私诱导等内容。
  2. 遇到不适合儿童的话题，要简短收住，并转到安全、温和、适合儿童的科普方向。
  3. 如果你不确定，就直接说“我不太确定”，然后给出保守、简单的解释，不要编造。

selected_module:
  VAD: SileroVAD
  ASR: FunASRRealtime
  LLM: Qwen36PlusLLM
  TTS: QwenRealtimeTTS
  Memory: nomem
  Intent: nointent

Intent:
  nointent:
    type: nointent

Memory:
  nomem:
    type: nomem

ASR:
  FunASRRealtime:
    type: funasr_realtime
    api_key: ""
    model: fun-asr-realtime
    format: pcm
    sample_rate: 16000
    semantic_punctuation_enabled: false
    ws_url: wss://dashscope.aliyuncs.com/api-ws/v1/inference
    output_dir: tmp/

LLM:
  Qwen36PlusLLM:
    type: openai
    api_key: ""
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen3.6-plus
    temperature: 0.5
    max_tokens: 260
    top_p: 0.8
    extra_body:
      enable_thinking: false
    timeout:
      pool: 5
      connect: 5
      write: 10
      read: 120

TTS:
  QwenRealtimeTTS:
    type: qwen_realtime
    api_key: ""
    model: qwen3-tts-instruct-flash-realtime
    mode: commit
    voice: Cherry
    response_format: pcm_24000
    instructions: 使用温柔、自然、适合儿童科普讲解的中文语气。
    optimize_instructions: true
    first_commit_chars: 24
    commit_chars: 40
    commit_punctuations: "。！？!?；;\n"
    ws_url: wss://dashscope.aliyuncs.com/api-ws/v1/realtime
    output_dir: tmp/
